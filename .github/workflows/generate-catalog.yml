name: Generate TAfC AI texture catalog

on:
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'tools/generate_ai_catalog.py'
      - '.github/workflows/generate-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tafc-ai-catalog-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image pipeline dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Build PBR packs from AI-generated source textures
        run: python tools/generate_ai_catalog.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets index.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'assets: rebuild catalog from AI-generated texture sources [skip ci]'
          git push
