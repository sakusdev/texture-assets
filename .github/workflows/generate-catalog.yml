name: Generate TAfC material catalog

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_catalog.py'
      - '.github/workflows/generate-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tafc-catalog-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Generate PBR material catalog
        run: python tools/generate_catalog.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets index.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'assets: generate expanded TAfC PBR catalog [skip ci]'
          git push
