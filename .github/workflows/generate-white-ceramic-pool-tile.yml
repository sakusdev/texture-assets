name: Generate first TAfC material

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_white_ceramic_pool_tile.py'
      - '.github/workflows/generate-white-ceramic-pool-tile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Generate White Ceramic Pool Tile PBR pack
        run: python tools/generate_white_ceramic_pool_tile.py
      - name: Commit generated asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/white-ceramic-pool-tile-001 index.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'assets: generate White Ceramic Pool Tile 001 [skip ci]'
          git push
